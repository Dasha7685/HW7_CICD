name: ML CI Pipeline
on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Клонируем репозиторий
    - uses: actions/checkout@v4

    - name: Устанавливаем Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Устанавливаем зависимости
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Запускаем ML-пайплайн
      run: |
        python ml_pipeline.py
    - name: Делаем возпроизводимый ML-пайплайн
      run: |
        echo "Для воспроизводимого ML-пайплайна сохраняем:"
        echo "1. Код обучения модели, гиперпараметры и random_state"
        echo "2. Версии библиотек и зависимости"
        echo "3. Данные или способ их получения"
        echo "4. Метрики качества"